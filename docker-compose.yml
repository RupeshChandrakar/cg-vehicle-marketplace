name: cg-vehicle-marketplace

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cg_dev
      POSTGRES_PASSWORD: cg_dev_password
      POSTGRES_DB: cg_vehicle_marketplace
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cg_dev -d cg_vehicle_marketplace']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

  # S3-compatible object storage for local development (vehicle media uploads).
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: cg_dev
      MINIO_ROOT_PASSWORD: cg_dev_password
    ports:
      - '9000:9000' # API
      - '9001:9001' # Web console
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  redis_data:
  minio_data:
